services:
  redis:
    # Redis 8 ya trae RediSearch y RedisJSON, que necesita langgraph-checkpoint-redis.
    image: redis:8.10.3
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:version-21.2.1
    ports:
      - "6006:6006"   # UI + OTLP/HTTP
      - "4317:4317"   # OTLP/gRPC
    environment:
      # Desde la v21 Phoenix exige login por defecto; para desarrollo local se desactiva.
      PHOENIX_ENABLE_AUTH: "false"
    volumes: [phoenix-data:/root/.phoenix]

  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
    volumes:
      - vectorstore:/srv/vectorstore
      - chroma-models:/root/.cache/chroma   # modelo de embeddings (~80 MB), se descarga una vez
    depends_on:
      redis: { condition: service_healthy }
      phoenix: { condition: service_started }

volumes:
  redis-data:
  phoenix-data:
  vectorstore:
  chroma-models:
